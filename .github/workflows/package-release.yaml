name: Package Release
on:
  push:
    branches:
      - main
jobs:
  release:
    # A called workflow can only narrow the caller's token; grant exactly what its release job requests.
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: rainlanguage/rainix/.github/workflows/rainix-autopublish.yaml@main
    with:
      soldeer-package: rain-flare
    secrets: inherit
