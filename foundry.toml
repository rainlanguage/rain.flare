[package]
name = "rain-flare"
version = "0.1.2"

[profile.default]
libs = ['dependencies']

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

solc = "0.8.25"
optimizer = true
optimizer_runs = 1000
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false

fs_permissions = [
  { access = "read-write", path = "src/generated" },
  { access = "read-write", path = "meta" },
]

[dependencies]
"forge-std" = "1.17.0"
"@openzeppelin-contracts" = "5.7.0"
"rain-deploy" = "0.1.36"
"rain-intorastring" = "0.1.5"
"rain-lib-memkv" = "0.2.0"
"rain-lib-typecast" = "0.1.4"
"rain-math-binary" = "0.1.4"
"rain-math-float" = "0.3.13"
"rain-math-float-deploy" = "0.1.12"
"rain-metadata" = "0.1.46"
"rain-sol-codegen" = "0.1.39"
"rain-solmem" = "0.1.28"
"rain-string" = "0.3.11"
"rain-tofu-erc20-decimals" = "0.1.5"
"rainlang" = "0.2.39"

[soldeer]
recursive_deps = false
